<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generative Ink</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="panel">
    <div class="title">Generative Ink</div>

    <div class="group">
      <span class="label">Mood</span>
      <div class="moods">
        <button class="mood-btn active" data-mood="calm">Calm</button>
        <button class="mood-btn" data-mood="chaotic">Chaotic</button>
        <button class="mood-btn" data-mood="symmetrical">Symmetrical</button>
      </div>
    </div>

    <div class="group">
      <span class="label">Brush size <span id="sizeVal">6</span></span>
      <input type="range" id="sizeSlider" min="2" max="20" value="6" />
    </div>

    <div class="group">
      <span class="label">Trail fade <span id="fadeVal">6</span>%</span>
      <input type="range" id="fadeSlider" min="1" max="30" value="6" />
    </div>

    <div class="group">
      <span class="label">Sound reactivity</span>
      <button id="micBtn">Enable mic</button>
      <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
    </div>

    <button id="clearBtn">Clear canvas</button>
    <div class="hint" id="micStatus">Move your mouse or finger across the canvas to paint.</div>
  </div>

  <button id="toggleBtn" title="Hide/show panel">&times;</button>

  <script src="script.js"></script>
</body>
</html>
